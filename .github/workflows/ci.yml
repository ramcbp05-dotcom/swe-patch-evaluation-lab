name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  library:
    name: fieldlab suite (the pass-to-pass baseline)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: Reference library must be green
        # If this fails, every case's pass-to-pass set is meaningless.
        run: python -m pytest tests/ -v

  patches-current:
    name: patches match the build table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Committed patches are not stale
        # scripts/build_patches.py is the source of truth; a stale bug.patch
        # makes a case silently stop reproducing its own bug.
        run: python scripts/build_patches.py --check

  lab-integrity:
    name: case-collection integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest lab_tests/ -v

  evaluate:
    name: evaluate all candidates
    runs-on: ubuntu-latest
    needs: [library, patches-current]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Every case reproduces, gold resolves, wrong patches do not
        run: |
          python -m evaluation.cli evaluate \
            --report results/ci-evaluation.json \
            --keep-logs results/ci-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: |
            results/ci-evaluation.json
            results/ci-logs/
          retention-days: 14
